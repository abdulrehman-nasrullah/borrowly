  <text x="292" y="107" fill="#E4E4E7" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1">CASIO</text>
  <text x="292" y="128" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="9">fx-991EX CLASSWIZ</text>
