<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bookCover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#F4F4F5"/>
  <g transform="translate(250, 80)">
    <!-- Pages bottom/right edges -->
    <polygon points="280,50 310,65 310,445 280,430" fill="#E2E8F0" stroke="#CBD5E1"/>
    <polygon points="30,430 60,445 310,445 280,430" fill="#CBD5E1"/>
    <!-- Book Spine -->
    <path d="M 20 65 L 45 50 L 45 430 L 20 445 Z" fill="#0B0B0C"/>
    <!-- Book Front Cover -->
    <polygon points="45,50 280,50 280,430 45,430" fill="url(#bookCover)" stroke="#334155" stroke-width="2"/>
    <!-- Red Accent Stripe -->
    <rect x="45" y="70" width="235" height="12" fill="#D71920"/>
    <!-- Binary / Tree Graphic on Cover -->
    <circle cx="160" cy="180" r="14" fill="#38BDF8"/>
    <circle cx="110" cy="240" r="12" fill="#818CF8"/>
    <circle cx="210" cy="240" r="12" fill="#818CF8"/>
    <circle cx="85" cy="295" r="10" fill="#C084FC"/>
    <circle cx="135" cy="295" r="10" fill="#C084FC"/>
    <circle cx="185" cy="295" r="10" fill="#C084FC"/>
    <circle cx="235" cy="295" r="10" fill="#C084FC"/>
    <line x1="160" y1="180" x2="110" y2="240" stroke="#64748B" stroke-width="2"/>
    <line x1="160" y1="180" x2="210" y2="240" stroke="#64748B" stroke-width="2"/>
    <line x1="110" y1="240" x2="85" y2="295" stroke="#64748B" stroke-width="2"/>
    <line x1="110" y1="240" x2="135" y2="295" stroke="#64748B" stroke-width="2"/>
    <line x1="210" y1="240" x2="185" y2="295" stroke="#64748B" stroke-width="2"/>
    <line x1="210" y1="240" x2="235" y2="295" stroke="#64748B" stroke-width="2"/>
    <!-- Title Text -->
    <text x="162" y="115" fill="#FFFFFF" font-family="'Barlow Condensed', sans-serif" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="1">DATA STRUCTURES</text>
    <text x="162" y="138" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">&amp; ALGORITHMS IN C++</text>
    <text x="162" y="380" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">FOURTH EDITION</text>
    <text x="162" y="405" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Mark Allen Weiss</text>
  </g>
</svg>
