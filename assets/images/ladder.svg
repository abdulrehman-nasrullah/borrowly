<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="ladderMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E4E4E7"/>
      <stop offset="50%" stop-color="#F4F4F5"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#F4F4F5"/>
  <g transform="translate(260, 60)">
    <!-- Top Cap (Tool tray) -->
    <rect x="75" y="30" width="130" height="24" rx="6" fill="#D71920"/>
    <!-- Left Stile -->
    <polygon points="90,54 106,54 44,480 20,480" fill="url(#ladderMetal)" stroke="#71717A" stroke-width="1.5"/>
    <!-- Right Stile -->
    <polygon points="174,54 190,54 260,480 236,480" fill="url(#ladderMetal)" stroke="#71717A" stroke-width="1.5"/>
    <!-- Back support legs (Step ladder A-frame) -->
    <line x1="100" y1="54" x2="55" y2="480" stroke="#71717A" stroke-width="6"/>
    <line x1="180" y1="54" x2="225" y2="480" stroke="#71717A" stroke-width="6"/>
    <line x1="68" y1="340" x2="212" y2="340" stroke="#71717A" stroke-width="4"/>
    <!-- Rungs -->
    <!-- Rung 1 -->
    <rect x="94" y="110" width="92" height="12" rx="2" fill="url(#ladderMetal)" stroke="#71717A"/>
    <!-- Rung 2 -->
    <rect x="85" y="170" width="110" height="12" rx="2" fill="url(#ladderMetal)" stroke="#71717A"/>
    <!-- Rung 3 -->
    <rect x="76" y="230" width="128" height="12" rx="2" fill="url(#ladderMetal)" stroke="#71717A"/>
    <!-- Rung 4 -->
    <rect x="67" y="290" width="146" height="12" rx="2" fill="url(#ladderMetal)" stroke="#71717A"/>
    <!-- Rung 5 -->
    <rect x="58" y="350" width="164" height="12" rx="2" fill="url(#ladderMetal)" stroke="#71717A"/>
    <!-- Rung 6 -->
    <rect x="49" y="410" width="182" height="12" rx="2" fill="url(#ladderMetal)" stroke="#71717A"/>
    <!-- Anti-slip rubber feet -->
    <rect x="16" y="476" width="32" height="14" rx="3" fill="#18181B"/>
    <rect x="232" y="476" width="32" height="14" rx="3" fill="#18181B"/>
  </g>
</svg>
