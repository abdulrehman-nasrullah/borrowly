<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <radialGradient id="rgbRing" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#D71920"/>
      <stop offset="90%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="#F4F4F5"/>
  <g transform="translate(280, 70)">
    <!-- Main Enclosure -->
    <rect x="20" y="20" width="200" height="440" rx="20" fill="url(#grill)" stroke="#27272A" stroke-width="4"/>
    <!-- Top Carry Handle -->
    <rect x="70" y="5" width="100" height="15" rx="4" fill="#3F3F46"/>
    <!-- Top Tweeter -->
    <circle cx="120" cy="90" r="30" fill="#27272A" stroke="#52525B" stroke-width="2"/>
    <circle cx="120" cy="90" r="14" fill="#18181B"/>
    <!-- Upper Woofer with RGB Ring -->
    <circle cx="120" cy="200" r="62" fill="none" stroke="url(#rgbRing)" stroke-width="6"/>
    <circle cx="120" cy="200" r="54" fill="#18181B" stroke="#3F3F46" stroke-width="2"/>
    <circle cx="120" cy="200" r="22" fill="#27272A"/>
    <!-- Lower Woofer with RGB Ring -->
    <circle cx="120" cy="340" r="62" fill="none" stroke="url(#rgbRing)" stroke-width="6"/>
    <circle cx="120" cy="340" r="54" fill="#18181B" stroke="#3F3F46" stroke-width="2"/>
    <circle cx="120" cy="340" r="22" fill="#27272A"/>
    <!-- Bottom Bass Port -->
    <ellipse cx="120" cy="425" rx="30" ry="12" fill="#09090B" stroke="#27272A" stroke-width="2"/>
    <!-- Power & Volume knobs on top -->
    <circle cx="50" cy="35" r="8" fill="#52525B"/>
    <circle cx="190" cy="35" r="8" fill="#D71920"/>
  </g>
</svg>
